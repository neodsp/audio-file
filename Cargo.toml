[package]
authors = ["Stephan Eckes <stephan@neodsp.com>"]
categories = ["multimedia::audio"]
description = "A simple library to read and write audio files on your disk."
edition = "2024"
keywords = ["audio", "io", "mp3", "neodsp", "wav"]
license = "MIT OR Apache-2.0"
name = "audio-file"
readme = "README.md"
repository = "https://github.com/neodsp/audio-file"
rust-version = "1.88"
version = "0.5.0"

[dependencies]
audioadapter-buffers = "4"
num-traits = "0.2"
rubato = "4"
symphonia = { version = "0.6", default-features = false, optional = true }
thiserror = "2"

audio-blocks = { version = "0.7", optional = true }

[dev-dependencies]
approx = "0.5"
audio-blocks = { version = "0.7" }

[features]
default = ["all-codecs", "simd"]

# Add utility functions for channel access etc
audio-blocks = ["dep:audio-blocks"]

# Read anything the built-in wav decoder does not cover, through Symphonia.
# Every codec feature below enables it, so it is rarely named on its own. Without
# it this crate writes wav and reads integer PCM and IEEE float wav, which is
# everything it writes itself, and nothing else.
symphonia = ["dep:symphonia"]

# All codecs including royalty-encumbered formats (MP3, AAC, etc.)
all-codecs = ["symphonia", "symphonia/all"]

# The wav encodings the built-in decoder does not cover: A-law, mu-law and
# ADPCM.
#
# There is deliberately no plain `wav` feature. Symphonia splits the RIFF
# demuxer from the encodings inside it, and the demuxer on its own can decode
# none of them, so a `wav` feature would pull all of Symphonia in while widening
# what can be read by nothing at all: integer PCM and IEEE float already read
# with no feature, and an A-law file would still fail for want of a codec.
wav-compressed = ["symphonia", "symphonia/wav", "pcm", "adpcm"]

# Enable Symphonia's SIMD optimizations. A modifier rather than an enabler, so it
# does nothing in a build without Symphonia.
simd = ["symphonia?/opt-simd"]

aac = ["symphonia", "symphonia/aac"]
adpcm = ["symphonia", "symphonia/adpcm"]
aiff = ["symphonia", "symphonia/aiff"]
alac = ["symphonia", "symphonia/alac"]
caf = ["symphonia", "symphonia/caf"]
flac = ["symphonia", "symphonia/flac"]
isomp4 = ["symphonia", "symphonia/isomp4"]
mkv = ["symphonia", "symphonia/mkv"]
mp1 = ["symphonia", "symphonia/mp1"]
mp2 = ["symphonia", "symphonia/mp2"]
mp3 = ["symphonia", "symphonia/mp3"]
ogg = ["symphonia", "symphonia/ogg"]
pcm = ["symphonia", "symphonia/pcm"]
vorbis = ["symphonia", "symphonia/vorbis"]
