[package]
authors = ["Stephan Eckes <stephan@neodsp.com>"]
categories = ["multimedia::audio"]
description = "A simple library to read and write audio files on your disk."
edition = "2024"
keywords = ["audio", "io", "mp3", "neodsp", "wav"]
license = "MIT OR Apache-2.0"
name = "audio-file"
readme = "README.md"
repository = "https://github.com/neodsp/audio-file"
rust-version = "1.88"
version = "0.5.0"

[dependencies]
audioadapter-buffers = "4"
hound = "3.5"
num = "0.4"
rubato = "4"
symphonia = { version = "0.6", default-features = false }
thiserror = "2"

audio-blocks = { version = "0.7", optional = true }

[dev-dependencies]
approx = "0.5"
audio-blocks = { version = "0.7" }

[features]
default = ["all-codecs", "simd"]

# Add utility functions for channel access etc
audio-blocks = ["dep:audio-blocks"]

# All codecs including royalty-encumbered formats (MP3, AAC, etc.)
all-codecs = ["symphonia/all"]

# Enable Symphonia's SIMD optimizations
simd = ["symphonia/opt-simd"]

aac = ["symphonia/aac"]
adpcm = ["symphonia/adpcm"]
aiff = ["symphonia/aiff"]
alac = ["symphonia/alac"]
caf = ["symphonia/caf"]
flac = ["symphonia/flac"]
isomp4 = ["symphonia/isomp4"]
mkv = ["symphonia/mkv"]
mp1 = ["symphonia/mp1"]
mp2 = ["symphonia/mp2"]
mp3 = ["symphonia/mp3"]
ogg = ["symphonia/ogg"]
pcm = ["symphonia/pcm"]
vorbis = ["symphonia/vorbis"]
wav = ["symphonia/wav"]
