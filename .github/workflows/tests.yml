name: 🧪 Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 🧪 Full Test Suite on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-features --all-targets --workspace
        # --all-targets skips doc tests, so run them separately. Both with the
        # default features and with all of them, so that a doc example using an
        # optional feature cannot break the default build.
      - run: cargo test --locked --doc --workspace
      - run: cargo test --locked --all-features --doc --workspace

  reduced-features:
    name: 🧪 Reduced Features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["wav,pcm", "ogg,vorbis", "isomp4,aac", "mkv,flac", "mp3"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        # Every test that needs a fixture format is gated on the features of that
        # format, so the whole suite runs for each combination. A name filter
        # would pass silently once the test it names is renamed, because cargo
        # test succeeds when a filter matches nothing.
        #
        # --all-targets skips the doc tests, which all read the WAV fixtures.
      - run: cargo test --locked --no-default-features --features ${{ matrix.features }} --all-targets --workspace
      - name: Verify WAV/PCM feature isolation
        if: matrix.features == 'wav,pcm'
        shell: bash
        run: |
          cargo tree -e features --no-default-features --features wav,pcm -i symphonia | tee symphonia-features.txt
          if grep -E 'symphonia feature "(default|opt-simd|aac|adpcm|aiff|alac|caf|flac|isomp4|mkv|mp1|mp2|mp3|ogg|vorbis)"' symphonia-features.txt; then
            echo "Unexpected Symphonia feature enabled by wav,pcm"
            exit 1
          fi
