name: 🛡️ Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-fmt:
    name: 📝 Code Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  taplo-fmt:
    name: 📄 TOML Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: uncenter/setup-taplo@v1
      - run: taplo fmt --check

  clippy:
    name: 📎 Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-features --all-targets --workspace -- -D warnings
        # The optional features cfg out parts of the crate and its tests, so lint
        # both ends of the range instead of only the complete one: nothing
        # enabled at all, and each optional dependency that is not a codec on its
        # own. `audio-blocks` without `resample` is its own combination, because
        # the tests it adds build a `ReadConfig` that has one field fewer.
      - run: cargo clippy --locked --no-default-features --all-targets --workspace -- -D warnings
      - run: cargo clippy --locked --no-default-features --features resample --all-targets --workspace -- -D warnings
      - run: cargo clippy --locked --no-default-features --features audio-blocks --all-targets --workspace -- -D warnings
      - run: cargo clippy --locked --no-default-features --features wav-compressed --all-targets --workspace -- -D warnings

  doc:
    name: 📚 Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --document-private-items

  semver:
    name: 🏷️ Semver Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  msrv:
    name: 🏗️ MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
        # --locked so that a dependency update cannot silently change what is
        # checked, --all-targets so that the tests have to build as well.
      - run: cargo check --locked --all-features --all-targets --workspace

  readme:
    name: 📖 README Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-rdme
        # cargo-rdme resolves intralinks with a pinned nightly rustdoc, which the
        # stable toolchain alone does not provide. This is a rustup shim on the
        # runner, so the toolchain has to be installed explicitly.
      - run: cargo rdme install-rust-toolchain-for-intralinks
      - run: cargo rdme --check
