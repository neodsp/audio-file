name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

# Publishes with crates.io trusted publishing, so no API token is stored in the
# repository.
permissions:
  # creates the GitHub release
  contents: write
  # requests the OIDC token that crates.io exchanges for a short-lived publish token
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history, so that the check below can walk back from the tag to
      # origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify the tag matches the crate version and sits on main
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match crate version $version"
            exit 1
          fi
          # Only releases from main are published; a tag on a side branch must
          # not ship.
          commit=$(git rev-list -n 1 "$tag")
          git fetch origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag $tag points at $commit, which is not on the main branch"
            exit 1
          fi

      # The release notes are the tag's section of CHANGELOG.md, without its
      # heading. Checked before publishing, because a publish can never be undone
      # and a release without notes is a changelog entry that was forgotten.
      - name: Extract the release notes from the changelog
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## \[|^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no entry for $GITHUB_REF_NAME"
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      # Fails with a clear error if the version is already on crates.io, which a
      # publish can never undo. A re-run after a partial failure then means
      # finishing the release by hand, with the notes from the changelog:
      # gh release create <tag> --notes-file <notes>
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `gh release create` fails on an existing release, so re-running the
        # workflow for a tag would fail instead of updating the notes.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
